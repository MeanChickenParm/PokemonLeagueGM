<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pokémon League GM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: league-office dashboard — navy masthead band, tab rail, two-column desk (main work left, team/news right) */
:root {
  --bg: #E8ECF1; --surface: #FFFFFF; --sunk: #F2F4F8; --ink: #152033; --muted: #5A6679; --line: #D3DAE4;
  --band: #16223A; --band-ink: #F3F5FA; --band-muted: #A9B6CC;
  --red: #C8312F; --red-ink: #FFFFFF; --gold: #B5841A; --gold-soft: #F6EBCB; --win: #23804E; --loss: #B83636; --amber: #C98A12;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --font-body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1626; --surface: #16213A; --sunk: #121C31; --ink: #E5EBF4; --muted: #95A4BC; --line: #26344F;
  --band: #0A1120; --band-ink: #EEF2F9; --band-muted: #8D9AB3;
  --red: #EE5149; --red-ink: #FFFFFF; --gold: #E2B44C; --gold-soft: #3A3121; --win: #48C07D; --loss: #F06B6B; --amber: #E8AE3E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1626; --surface: #16213A; --sunk: #121C31; --ink: #E5EBF4; --muted: #95A4BC; --line: #26344F;
  --band: #0A1120; --band-ink: #EEF2F9; --band-muted: #8D9AB3;
  --red: #EE5149; --red-ink: #FFFFFF; --gold: #E2B44C; --gold-soft: #3A3121; --win: #48C07D; --loss: #F06B6B; --amber: #E8AE3E; color-scheme: dark; }

html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
button { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; letter-spacing: 0.01em; line-height: 1.05; margin: 0; text-wrap: balance; text-transform: uppercase; }
h1 { font-size: 2.4rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.12rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.fine { font-size: 0.8rem; color: var(--muted); }
.num, .tbl td.num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.86rem; }
.eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* masthead */
.top { background: var(--band); color: var(--band-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top-in, .tabs-in, .wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; flex-wrap: wrap; }
.mark { display: flex; align-items: center; gap: 12px; }
.mark-ball { width: 30px; height: 30px; border-radius: 50%; flex: none; background: linear-gradient(var(--red) 0 44%, var(--band-ink) 44% 56%, #F3F5FA 56%); position: relative; box-shadow: inset 0 0 0 2px var(--band-ink); }
.mark-ball::after { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #F3F5FA; box-shadow: 0 0 0 3px var(--band); }
.mark-name { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1; }
.mark-ver { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 400; color: var(--band-muted); letter-spacing: 0; vertical-align: middle; }
.mark-sub { font-family: var(--font-mono); font-size: 0.76rem; color: var(--band-muted); }
.top-act { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.top .btn { background: transparent; color: var(--band-ink); border-color: color-mix(in srgb, var(--band-ink) 30%, transparent); }
.top .btn.primary { background: var(--red); border-color: var(--red); color: var(--red-ink); }

.tabs { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: calc(env(safe-area-inset-top, 0px) + 54px); z-index: 15; }
.tabs-in { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 12px 10px; font-weight: 600; font-size: 0.9rem; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; cursor: pointer; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--red); }
@media (max-width: 640px) { .tabs { position: static; } }

.wrap { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 16px; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 600; font-size: 0.88rem; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--red); color: var(--red-ink); border-color: var(--red); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 45%, transparent); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; }
.btn.icon { padding: 4px 11px; font-size: 1.1rem; line-height: 1.4; }
.embednote { background: var(--gold-soft); border-bottom: 1px solid var(--line); }
.embednote-in { max-width: 1180px; margin: 0 auto; padding: 10px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; font-size: 0.86rem; color: var(--ink); }
.embednote-in > span:first-child { flex: 1 1 320px; }
.embednote-act { display: flex; gap: 8px; flex: none; }
.newdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--red); margin-left: 6px; vertical-align: middle; }
.upd { border-top: 1px solid var(--line, rgba(127,127,127,.25)); padding-top: 10px; margin-top: 10px; }
.upd-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.upd-h h3 { margin: 0; }
.gl-sec { border-top: 1px solid var(--line); padding-top: 10px; }
.gl-h { display: flex; justify-content: space-between; align-items: baseline; }
.gl-h h3 { margin: 0 0 6px; }
.gl { margin: 0 0 6px; }
.gl-row { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 4px 14px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.gl-row:last-child { border-bottom: 0; }
.gl-row dt { font-weight: 600; }
.gl-row dd { margin: 0; }
@media (max-width: 560px) { .gl-row { grid-template-columns: 1fr; } }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { border: 0; background: none; color: var(--muted); font-size: 0.82rem; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.tlink { border: 0; background: none; padding: 0; font-weight: 600; cursor: pointer; text-align: left; }
.tlink:hover { text-decoration: underline; }
.tlink.you { color: var(--red); }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 0.8rem; cursor: pointer; }
.pill.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.ph .muted { font-size: 0.82rem; }
.callout { border-left: 4px solid var(--red); }
.callout p { max-width: 68ch; }
.grid-office { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 860px) { .grid-office { grid-template-columns: 1fr; } }

/* trainer card */
.tcard-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
.tcard h1 { margin-top: 2px; }
/* long names: the card's name block may shrink, the OVR never gets pushed off the card, and very long names step down */
.tcard-id { min-width: 0; flex: 1 1 auto; }
.tcard-cls { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1rem; letter-spacing: .02em; color: var(--muted); margin-top: 2px; }
.tcard-name { overflow-wrap: anywhere; }
.tcard-name.long { font-size: 2rem; }
.tcard-name.xlong { font-size: 1.7rem; }
@media (max-width: 560px) { .tcard-name { font-size: 1.9rem; } .tcard-name.long { font-size: 1.6rem; } .tcard-name.xlong { font-size: 1.35rem; } .tcard-ovr span { font-size: 2.8rem; } }
/* trainer tabs: very long names are cut short with an ellipsis (the full name is on the trainer's page) */
.ttab-n { max-width: 16em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 560px) { .ttab-n { max-width: 11em; } }
/* small tags never break across lines */
.tag, .abchip, .itemchip, .ty { white-space: nowrap; }
.spec { margin-top: 6px; font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; }
.spec > span { min-width: 0; }
.tcard-ovr { text-align: right; flex: none; }
.tcard-ovr span { display: block; font-family: var(--font-display); font-weight: 800; font-size: 3.6rem; line-height: 0.9; color: var(--ink); }
.tcard-ovr small { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.ratings { display: grid; gap: 6px; }
.rt { display: grid; grid-template-columns: 80px 1fr 64px; gap: 10px; align-items: center; font-size: 0.85rem; }
.rt-k { color: var(--muted); }
.rt-bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.rt-bar i { display: block; height: 100%; background: var(--ink); opacity: 0.75; }
.rt-v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.85rem; }
.delta { margin-left: 6px; font-size: 0.75rem; } .delta.up { color: var(--win); } .delta.down { color: var(--loss); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px 16px; margin: 4px 0 0; font-size: 0.8rem; }
.help dt { font-weight: 600; } .help dd { margin: 0; color: var(--muted); }

/* badges */
.badges { display: flex; gap: 4px; }
.bdg { width: 12px; height: 12px; transform: rotate(45deg); border: 1.5px solid var(--line); background: var(--sunk); border-radius: 2px; }
.bdg.on { background: var(--gold); border-color: var(--gold); }
.badges.big { gap: 10px; padding: 4px 4px 2px; flex-wrap: wrap; }
.badges.big .bdg { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 5px; font-family: var(--font-display); font-weight: 800; font-size: 0.9rem; color: var(--muted); }
.badges.big .bdg { transform: rotate(45deg); }
.badges.big .bdg.on { color: #2A1E05; background: linear-gradient(135deg, color-mix(in srgb, var(--gold) 70%, #fff), var(--gold)); }
.badges.big .bdg { line-height: 1; }
.badges.big .bdg::before { content: none; }

/* type chips & mons */
.ty { display: inline-block; background: var(--tc); color: var(--tt); font-size: 0.66rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 4px; line-height: 1.4; margin-right: 3px; vertical-align: middle; }
.ty.mixed { background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.mon { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 4px; border: 0; border-top: 1px solid var(--line); background: none; width: 100%; text-align: left; cursor: pointer; border-radius: 6px; }
.mon:hover { background: var(--sunk); }
.mon-main { display: flex; flex-direction: column; min-width: 0; }
.mon-rec { display: flex; flex-direction: column; align-items: flex-end; font-family: var(--font-mono); font-size: 0.8rem; }
.mon-rec small { color: var(--muted); font-size: 0.66rem; }
.mon:first-of-type { border-top: 0; }
.dot { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--tc) 50%, var(--tc2) 50%); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--ink) 12%, transparent); }
.dot.big { width: 44px; height: 44px; }
.mon-name { font-weight: 700; }
.mon-sub { font-size: 0.78rem; display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: center; }
.evo { font-size: 0.74rem; color: var(--muted); }
.mon-lv { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; line-height: 1; text-align: right; }
.mon-lv small, .mon-bst small { font-family: var(--font-mono); font-size: 0.62rem; color: var(--muted); font-weight: 400; margin-right: 2px; display: block; }
.mon-bst { font-family: var(--font-mono); font-size: 0.8rem; text-align: right; width: 38px; }

/* week planner */
.strip { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(8, minmax(0, 1fr)); } }
.wk { border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 800; font-size: 1.05rem; }
.wk small { font-family: var(--font-mono); font-weight: 400; font-size: 0.62rem; color: var(--muted); }
.wk.w { background: color-mix(in srgb, var(--win) 18%, var(--surface)); border-color: var(--win); color: var(--win); }
.wk.l { background: color-mix(in srgb, var(--loss) 14%, var(--surface)); border-color: var(--loss); color: var(--loss); }
.wk.o { color: var(--muted); }
.wk.now { border: 2px solid var(--red); background: var(--surface); }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 640px) { .acts { grid-template-columns: 1fr; } }
.act { text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; transition: border-color .15s, transform .15s; }
.act:hover { border-color: var(--ink); transform: translateY(-1px); }
.act.go { background: var(--surface); border: 2px solid var(--red); }
.act.disabled { cursor: default; opacity: 0.85; } .act.disabled:hover { transform: none; border-color: var(--line); }
.act-k { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.act.go .act-k { color: var(--red); }
.act-t { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; text-transform: uppercase; line-height: 1.1; }
.act p { font-size: 0.84rem; color: var(--muted); }
.good { color: var(--win); font-weight: 600; } .bad { color: var(--loss); font-weight: 600; }
.warn { color: var(--loss); font-size: 0.86rem; font-weight: 600; }
.result.won { border-left: 4px solid var(--win); } .result.lost { border-left: 4px solid var(--loss); }
.res-tag { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: 1.05rem; }
.result.won .res-tag { color: var(--win); } .result.lost .res-tag { color: var(--loss); }
.result .btn { align-self: flex-start; }

/* tables */
.scroll { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
.tbl th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
.tbl.compact td { padding: 6px 4px; }
.tbl tr:last-child td { border-bottom: 0; }
.you-row td { background: color-mix(in srgb, var(--red) 7%, transparent); }
.taken td { opacity: 0.45; }
.tbl td.st { text-align: center; font-family: var(--font-display); font-weight: 800; }
.tbl td.st.w { color: var(--win); } .tbl td.st.l { color: var(--loss); }
.ovr { display: inline-block; min-width: 30px; text-align: center; font-family: var(--font-mono); font-weight: 600; font-size: 0.8rem; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); }
.ovr.hi { background: var(--gold-soft); border-color: var(--gold); }
.ovr.lo { color: var(--muted); }
.tag { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); font-weight: 600; }
.tag.gold { border-color: var(--gold); color: var(--gold); }

/* elite */
.elite-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.elite { border: 1px solid var(--line); background: var(--sunk); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.elite-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 1rem; }
.elite-s { display: flex; gap: 6px; align-items: center; font-size: 0.8rem; }
.rec { margin-left: auto; font-family: var(--font-mono); font-size: 0.8rem; }
.mini { list-style: none; margin: 0; padding: 0; font-size: 0.84rem; }
.mini li { display: flex; justify-content: space-between; padding: 2px 0; border-top: 1px dashed var(--line); }
.mini li:first-child { border-top: 0; font-weight: 700; }
.champ { border-top: 4px solid var(--gold); }
.champ .elite { background: var(--surface); }

/* news */
.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.news li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 0.86rem; }
.news li:first-child { border-top: 0; }
.n-when { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); padding-top: 2px; }
.n-you span:last-child { color: var(--red); }
.n-title span:last-child { font-weight: 600; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters.sub { margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--gold); }
.tag.fam { font-size: 11px; }
.tag.fam-leader { border-color: #3D7DD8; color: #3D7DD8; }
.tag.fam-e4 { border-color: #8A55C9; color: #8A55C9; }
.tag.fam-champ { border-color: var(--gold); color: var(--gold); }
.tag.fam-anime { border-color: #D2563B; color: #D2563B; }
.tag.fam-kahuna { border-color: #C2702A; color: #C2702A; }
.tag.fam-captain { border-color: #2E8FB0; color: #2E8FB0; }
.tag.fam-boss { border-color: #7A6A88; color: #7A6A88; }
.tag.fam-prof { border-color: #5C8A3A; color: #5C8A3A; }
.tag.fam-brain { border-color: #C9512C; color: #C9512C; }
.tag.fam-rival { border-color: #2F9C7A; color: #2F9C7A; }
.changes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.hof { margin: 0; padding-left: 18px; }
.simbar { height: 8px; border-radius: 999px; background: color-mix(in srgb, currentColor 12%, transparent); overflow: hidden; margin: 8px 0 12px; }
.simbar i { display: block; height: 100%; background: var(--gold); transition: width .2s; }
.mini-list { margin: 0 0 12px; padding-left: 18px; font-size: 14px; }
.sim-n .seg { min-width: 44px; }
.loadsave { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 10px; }
.panel.shame { border-top: 3px solid var(--red); }
.panel.shame .rec-v { color: var(--red); }
.recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.recboard { border: 1px solid var(--line, rgba(127,127,127,.25)); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.rec-h { font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: 17px; letter-spacing: .02em; text-transform: uppercase; margin-bottom: 6px; }
.recboard ol { margin: 0; padding-left: 0; list-style: none; }
.recboard li { display: grid; grid-template-columns: 22px 1fr auto; gap: 0 8px; padding: 3px 0; align-items: start; }
/* a wrapped name keeps its rank and value on its first line */
.recboard li .rec-rank, .recboard li .rec-v { padding-top: 3px; }
